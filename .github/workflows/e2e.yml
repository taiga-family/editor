name: ⚙️ E2E tests
on:
  pull_request:

env:
  RETRY_COUNT: 2
  PW_RESULT: ./projects/demo-playwright/tests-results

jobs:
  cypress:
    name: Cypress / Component Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-variables@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      - uses: taiga-family/actions/setup-node@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      - uses: taiga-family/actions/setup-cypress@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      - run: npx nx component-test demo-cypress

  e2e:
    name: E2E playwright
    runs-on: ubuntu-latest
    outputs:
      details_url: ${{ steps.e2e-report.outputs.details_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-variables@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      - uses: taiga-family/actions/setup-node@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      - uses: taiga-family/actions/setup-playwright@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0

      - run: npx nx build editor-demo -c development
      - uses: taiga-family/actions/http-serve@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
        with:
          port: ${{ env.NG_SERVER_PORT }}
          directory: ${{ env.DIST }}

      - run: npx nx e2e editor-demo-playwright -- --update-snapshots

      - uses: taiga-family/actions/git-clone@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
        with:
          branch: snapshots/demo/next/${{ github.base_ref }}
          destination: ${{ env.DIST_NEXT }}

      - uses: taiga-family/actions/http-serve@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
        with:
          port: ${{ env.NG_SERVER_PORT }}
          directory: ${{ env.DIST_NEXT }}

      - run: npx nx e2e editor-demo-playwright
        continue-on-error: true

      - run: tree ${{ env.PW_RESULT }}
      - name: Deploy e2e report
        id: e2e-report
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        continue-on-error: true
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUI_EDITOR }}
          channelId: pr${{ github.event.number }}-${{ github.head_ref }}-e2e
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          target: taiga-editor-e2e-report
          projectId: taiga-editor
          disableComment: 'true'
          expires: 1d

      - name: Upload report artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PW_RESULT }}/test-results.json
          name: ${{ env.PLAYWRIGHT_SNAPSHOTS_ARTIFACTS_KEY }}_report
          compression-level: 0
          retention-days: 1

      - uses: taiga-family/actions/playwright-screenshot-diff@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0

      - name: Upload artifacts / ${{ env.PLAYWRIGHT_SNAPSHOTS_ARTIFACTS_KEY }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PW_RESULT }}/**/*-retry${{ env.RETRY_COUNT }}/**/*.diff.png
          name: ${{ env.PLAYWRIGHT_SNAPSHOTS_ARTIFACTS_KEY }}
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

  result:
    name: E2E result
    needs: [e2e, cypress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-variables@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0

      - name: Download artifacts for Playwright
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ env.PW_RESULT }}
          name: ${{ env.PLAYWRIGHT_SNAPSHOTS_ARTIFACTS_KEY }}
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ env.PW_RESULT }}
          name: ${{ env.PLAYWRIGHT_SNAPSHOTS_ARTIFACTS_KEY }}_report

      - uses: taiga-family/actions/playwright-diff-check@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
        with:
          pw-result: ${{ env.PW_RESULT }}

      - uses: daun/playwright-report-summary@5359ae22f265fd2dfdb7744a0cc6614c5c3abde6 # v4.1.1
        if: always()
        with:
          custom-info: 'For more information, [see our report](${{ needs.e2e.outputs.details_url }})'
          report-file: ${{ env.PW_RESULT }}/test-results.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
